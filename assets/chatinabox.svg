<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Chatinabox</title>
  <desc id="description">Real Codex CLI sessions, driven from Telegram, one session per work topic.</desc>

  <defs>
    <linearGradient id="cb-spectral" gradientUnits="userSpaceOnUse" x1="196" y1="120" x2="428" y2="180">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset=".55" stop-color="#8fb8ff"/>
      <stop offset="1" stop-color="#b5a3ff"/>
    </linearGradient>
    <linearGradient id="cb-seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#6ee7ff" stop-opacity=".85"/>
      <stop offset=".52" stop-color="#8fb8ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b5a3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cb-meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#b5a3ff"/>
    </linearGradient>
    <linearGradient id="cb-row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d181e"/>
      <stop offset="1" stop-color="#070e12"/>
    </linearGradient>
    <radialGradient id="cb-sky" cx=".28" cy="0" r=".85">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#8fb8ff" stop-opacity=".045"/>
      <stop offset="1" stop-color="#8fb8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cb-bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity=".15"/>
      <stop offset=".6" stop-color="#8fb8ff" stop-opacity=".045"/>
      <stop offset="1" stop-color="#8fb8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cb-drift" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b5a3ff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#b5a3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cb-grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#dfeff6" fill-opacity=".05"/>
    </pattern>
    <clipPath id="cb-card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cb-card)">
    <rect width="1200" height="320" fill="#05080b"/>
    <rect width="1200" height="320" fill="url(#cb-grain)"/>
    <rect width="1200" height="320" fill="url(#cb-sky)"/>
    <ellipse cx="120" cy="330" rx="340" ry="150" fill="url(#cb-drift)"/>
    <ellipse cx="914" cy="150" rx="290" ry="145" fill="url(#cb-bloom)"/>
    <rect width="1200" height="1.5" fill="url(#cb-seam)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#16262b"/>

  <!-- Identity -->
  <rect x="72" y="63" width="24" height="2" rx="1" fill="#6ee7ff"/>
  <text x="108" y="70" fill="#6ee7ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="3.4">CODEX SESSIONS OVER TELEGRAM</text>

  <text x="70" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.4">
    <tspan fill="#f2f7f6">chat</tspan><tspan fill="url(#cb-spectral)">inabox</tspan>
  </text>

  <text x="73" y="210" fill="#93a6a5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19">Leave the terminal. Come back to the same session.</text>

  <rect x="73" y="236" width="430" height="1" fill="#16262b"/>
  <text x="73" y="264" fill="#5f7173" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.6">REAL SESSIONS · ONE PER TOPIC · RESUMABLE · SELF-HOSTED</text>

  <!-- Artifact: the forum overview -->
  <text x="700" y="70" fill="#5f7173" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.8">WORK TOPICS</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <!-- working -->
    <rect x="700" y="90" width="428" height="34" rx="11" fill="url(#cb-row)" stroke="#255b6b"/>
    <circle cx="722" cy="107" r="3.5" fill="#6ee7ff"/>
    <text x="740" y="112" fill="#d7e7ea" font-size="13.5">parser-fix</text>
    <g fill="#6ee7ff">
      <circle cx="1010" cy="107" r="2" opacity=".35"/>
      <circle cx="1019" cy="107" r="2" opacity=".65"/>
      <circle cx="1028" cy="107" r="2"/>
    </g>
    <text x="1112" y="111" fill="#6ee7ff" font-size="10" letter-spacing="1.8" text-anchor="end">WORKING</text>

    <!-- ready -->
    <rect x="700" y="130" width="428" height="34" rx="11" fill="url(#cb-row)" stroke="#16262b"/>
    <circle cx="722" cy="147" r="3.5" fill="#9bffdc"/>
    <text x="740" y="152" fill="#a9bdc0" font-size="13.5">deploy-audit</text>
    <text x="1112" y="151" fill="#7f9497" font-size="10" letter-spacing="1.8" text-anchor="end">READY</text>

    <!-- sleeping -->
    <rect x="700" y="170" width="428" height="34" rx="11" fill="url(#cb-row)" stroke="#16262b"/>
    <circle cx="722" cy="187" r="3.5" fill="#3c4d50"/>
    <text x="740" y="192" fill="#8a9ea1" font-size="13.5">release-notes</text>
    <text x="1112" y="191" fill="#5f7173" font-size="10" letter-spacing="1.8" text-anchor="end">SLEEPING</text>
  </g>

  <!-- Instrument row -->
  <rect x="700" y="228" width="427" height="3" rx="1.5" fill="#132522"/>
  <rect x="700" y="228" width="285" height="3" rx="1.5" fill="url(#cb-meter)"/>
  <circle cx="985" cy="229.5" r="3.5" fill="#8fb8ff"/>
  <text x="700" y="256" fill="#5f7173" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.2">SESSIONS ATTACHED</text>
  <text x="1127" y="256" fill="#93a6a5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4" text-anchor="end">3 live</text>
</svg>
